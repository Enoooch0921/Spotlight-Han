name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-check:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./script/build_and_run.sh --build-only
      - name: Check interface localizations
        run: ./script/check_localizations.sh
      - name: Run functional checks
        run: swift run HanSearchChecks
      - name: Verify signed Clock companion source
        run: python3 script/verify_clock_shortcut.py
      - name: Check Notes stream without private data
        run: python3 script/check_notes_stream.py
      - name: Check folder bookmark persistence
        run: |
          mkdir -p work
          swiftc -parse-as-library Sources/HanSearch/Services/FileAccessBookmarks.swift script/check_folder_bookmarks.swift -o work/BookmarkChecks
          work/BookmarkChecks
      - name: Validate Release packaging
        run: ./script/package_release.sh
